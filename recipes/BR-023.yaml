fixes:
  sub: Most likely cause first
  rows:
  - - Butter won't take
    - Dough too warm. Chill the bowl 15 min, add smaller pieces
  - - No window
    - Knead longer; flour under 12.5% protein won't get there
  - - Dome fell
    - Door opened before 20 min, or proofed past 1 cm over rim
  - - Dense, sunk crumb
    - Cooled upright. Skewer and invert within a minute
