code: BR-023
kind: sheet
name: Panettone
cls: Bread · Enriched, two-dough
lede: Two-dough panettone on a commercial-yeast biga in place of lievito madre. Raisins and candied orange,
  shaped cold, proofed warm, cooled hanging.
source: Jason Schreiber, Saveur · Adapted, metric
contains:
- Wheat
- Milk
- Egg
equipment:
- 2 paper molds 134 × 95 mm
- Stand mixer, hook
- 2 L lidded tub
- Mist bottle
- 4 skewers 30 cm
- 2 deep pots
- Probe
key_figures:
- label: Yield · 2 panettoni
  value: 2 × 610 g
- label: Hydration · water / all
  value: 49 / 62%
- label: Prefermented flour
  value: 16.2%
- label: Plan
  value: 2 days
- label: Oven · 350 °F
  value: 175 °C
last_change: Rev 04 · Notes fit
method_rail:
- sub: Day 1 · tick each step
  notes: null
- sub: Day 1 evening → day 2
  notes: null
method:
- head: Biga.
  text: Day 1. Yeast into warm water, stir in flour, knead 1 min. Cover until doubled, then chill.
  time: 1–2 h
  target: 45 °C water
- head: Primo, hydrate.
  text: Yeast into warm water in the mixer bowl. Add flour and biga; stir shaggy. Cover, rest.
  time: 10 min
  target: 45 °C water
- head: Primo, knead.
  text: Add sugar, milk powder, salt, yolk. Hook on low until smooth and tight; window tears.
  time: 12 min
  target: Low
- head: Primo, butter.
  text: A third on low, 2 min; rest in two adds on medium. Knead to a clear window.
  time: 12 min
  target: Medium
- head: Bulk.
  text: Ball up into the 2 L tub, mark the height, lid on. Warm until tripled, then chill 1 h.
  time: 1–2 h
  target: 30 °C, then 4 °C
- head: Aromatics.
  text: Mix honey, zest and vanilla seeds. Soak raisins in 45 g hot water; drain before use.
  time: ≤ 24 h
  target: Room temp
- head: Secondo, mix.
  text: Whisk flour + gluten. Yeast into cold water; add primo, yolks, flour. Low until wet.
  time: 1 min
  target: Low
- head: Secondo, sugar.
  text: Sugar in three adds on low, scraping down. Knead until it cleans the bowl.
  time: 15 min
  target: Low
- head: Secondo, butter.
  text: 14 g at a time on low; after a third, medium. Knead to a clear window.
  time: 10–12 min
  target: Medium
- head: Inclusions.
  text: 'Aromatics on medium until taken up. Low: peel, then drained raisins, until even.'
  time: 1–2 + 5 min
  target: Medium, then low
- head: Divide, shape.
  text: Oil the bench, halve by weight. Four slap-folds (fig. 1), round taut, into molds upright.
  time: 15 min
  target: 2 × 610 g
- head: Retard.
  text: Molds on a sheet inside a sealed produce bag. Refrigerate overnight.
  time: 8–16 h
  target: 4 °C
- head: Proof.
  text: Day 2. Out of the bag, warm and humid, until the dome peaks just over the rim. Preheat at 5 h.
  time: 5–6 h
  target: 30 °C
- head: Bake.
  text: Mist, pearl sugar. 20 min door shut, then drop; bake to 85 °C inside.
  time: 35–40 min
  target: 175 → 150 °C
  target_f: 350 → 300 °F
- head: Hang.
  text: 'Straight out: two skewers 2.5 cm up (fig. 2); invert over the pots until fully cool.'
  time: Until cool
  target: 4–12 h
