fixes:
  label_width: 200
  sub: Most likely cause first
  rows:
  - - Puffs collapsed
    - Underbaked or door opened early. Bake until the cracks color
  - - Flat, spread
    - Paste too loose. Hold back more egg
  - - Tea tastes weak
    - Whole leaf or leaves not pressed. Use broken leaf; press hard
  - - Cream thin once cold
    - Not boiled long enough. Bubble a full minute
