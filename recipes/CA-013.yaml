    subtotal: {label: Batter}
method:
- head: Prep.
  text: Rack in the middle; heat the oven. Butter and flour the Bundt; tap out the extra.
  time: —
  target: 175 °C
  target_f: 350 °F
- head: Swirl.
  text: Stir sugar, cocoa, salt, cinnamon and the chopped chocolate together; set aside.
  time: —
- head: Dry.
  text: Whisk flour, soda, cinnamon, ginger, salt, cardamom and nutmeg.
  time: —
- head: Cream.
  text: Paddle the oil and both sugars on medium until it looks like wet sand.
  time: 2 min
  target: Wet sand
- head: Eggs.
  text: One at a time, a minute each, scraping often. It looks broken until the last one.
  time: 3 min
  target: Satiny
- head: Pumpkin.
  text: Speed down; blend in the vanilla and the puree.
  time: —
- head: Dry in.
  text: Mixer off. A third of the dry; pulse, then low. Scrape; half the rest; then the last.
  time: —
  target: Just blended
- head: Finish.
  text: A few turns by hand with the spatula to catch the bottom of the bowl.
  time: —
- head: Layer.
  text: A third to half the batter in; smooth. Spoon the swirl over, off the sides. Rest on top.
  time: —
  target: Pan half full
- head: Bake.
  text: Until puffed, cracked on top and pulling from the sides. Tester clean; miss the swirl.
  time: 55–60 min
  target: ≈ 96 °C inside
- head: Rest.
  text: In the pan 10 min; turn out onto a rack. Cool fully before dusting, frosting or glazing.
  time: 10 min
  target: Until cold
done_when:
- [Top, 'Puffed, cracked, pulling from the sides']
- [Tester, 'Clean — poke beside the swirl, not through it']
- [Inside, '≈ 96 °C, if you probe']
keeps:
- [Room temp, '4 days, wrapped']
- [Frozen, '1 month, unglazed; thaw in the wrapper']
fixes:
  sub: Most likely cause first
  rows:
  - [Swirl on the bottom, 'Too little batter under it. Put a full half in first; keep the swirl off the sides']
  - ['Batter looks curdled', 'Normal until the last egg. Keep beating a minute; it turns satiny']
  - [Sunk in the middle, 'Underbaked, or soda past its date. Bake to cracked and pulling away']
  - [Stuck in the pan, 'Cooled past 10 min, or corners not floured. Time it; tap out the extra flour']
  - [Glaze smushed after freezing, 'Warm it with a hair dryer for a few seconds; it smooths out']
trials:
