method_rail:
- sub: Tick each step as done
  notes:
  - The batter looks broken until the last egg goes in, then turns satiny. Keep going.
  - Pure pumpkin puree, not pie filling. Libby's is the least watery.
formula:
  basis: '% · flour = 100'
  notes:
  - 'Finish, choose one: confectioners'' sugar; card FR-003 cream cheese frosting; or a chocolate glaze. The cake is a year-rounder without any of them.'
  - 'Altitude, 4,700 ft: 2 tsp soda is generous. Run B (soda −15%) before changing the sheet.'
  - 'Pan: butter and flour a 12-cup Bundt, or baker''s spray. Outside the formula.'
  - † Doesn't scale in a straight line past 2×.
