fixes:
  sub: Most likely cause first
  rows:
  - ['Soft, sticky', 'Under the mark, or a wet day. Recook not possible; wrap fast']
  - [Grainy, 'Crystals from the sides. Wash them; no stirring above the line']
  - [Scorched taste, 'Stopped stirring, or heat high. Medium; stir the floor']
  - [Sticks loose, 'Pushed too late. Sticks at leather-firm, 8–12 min']
  - [Slab cracked, 'Scored late. Score at the skin, 3–5 min']
