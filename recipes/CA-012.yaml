method_rail:
- sub: Tick each step as done
  notes:
  - Brown butter and the sugar coat are what set this apart. Don't skip the second coat.
  - Ordered ingredient · King Arthur boiled cider, 16 oz. Keeps a year in the fridge.
formula:
  basis: '% · flour = 100'
  notes:
  - 'Boiled cider: King Arthur (≈ 7 : 1). Or reduce 1 L fresh cider to 150 g, about 25 min at a hard simmer; weigh, don''t eyeball.'
  - 'Butter for A: weigh 200 g before browning. Scrape every brown speck into the batter.'
  - 'Pan: 15 g soft butter brushed on, 20 g sugar dusted, extra tapped out. Outside the formula.'
  - 'Altitude, 4,700 ft: powder and soda are already set −15% from sea level (8 / 3.5 g). Run C before changing them.'
  - † Doesn't scale in a straight line past 2×.
