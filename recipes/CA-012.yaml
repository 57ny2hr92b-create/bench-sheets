method:
- head: Prep.
  text: Rack in the lower third; heat the oven. Butter the Bundt, dust with sugar, tap out the extra.
  time: —
  target: 175 °C
  target_f: 350 °F
- head: Brown.
  text: Cook the butter until it foams, quiets and the solids go deep brown. Scrape into a bowl; cool.
  time: 6–8 min
  target: Solids brown
- head: Dry.
  text: Whisk flour, powder, soda, salt, cinnamon and nutmeg until no streaks of spice remain.
  time: —
- head: Wet.
  text: Whisk sugars and eggs until thick. Whisk in brown butter, cider, applesauce, buttermilk, vanilla.
  time: 1 min
  target: Butter ≤ 50 °C
- head: Fold.
  text: Add the dry in two adds; fold with a spatula just until no flour shows. Do not beat.
  time: —
  target: Don’t overmix
- head: Bake.
  text: Pour into the pan; smooth. Bake until a skewer is clean and the top springs back.
  time: 45–55 min
  target: 96 °C inside
- head: Rest.
  text: Cool in the pan 15 min, no longer, or the sugar coat welds it in. Invert onto a rack.
  time: 15 min
- head: Brush.
  text: Warm butter and boiled cider together; brush the whole warm cake, ridges and all.
  time: —
  target: Warm, not hot
- head: Coat.
  text: Spoon cinnamon-nutmeg sugar over every surface; re-brush the bare spots and coat again.
  time: —
  target: Two coats
- head: Cool.
  text: Fully, on the rack. The crust sets as the cake cools; cut only when cold.
  time: Until cold
  target: 1–2 h
done_when:
- [Inside, 96 °C; skewer clean]
- [Top, Springs back; edges pull from the pan]
- [Crust, Dry and sandy after cooling]
keeps:
- [Room temp, '2 days, covered; crust softens by day 2']
- [Frozen, '1 month, sliced; do not re-coat']
fixes:
  sub: Most likely cause first
  rows:
  - [Stuck in the pan, 'Cooled past 15 min, or sugar dusted too thick. Hot towel on the pan base']
  - [Sugar slid off, 'Cake too hot when brushed, or butter mix too thin. Wait 5 min, brush again']
  - [Gummy band at base, 'Underbaked, or brown butter still hot at step 04. Probe; cool the butter']
  - ['Dense, tight crumb', 'Overmixed at step 05, or leavening old. Fold only until no flour shows']
trials:
  sub: Change one variable per trial
  notes:
  - A is the sheet as written.
  - B swaps 30 g of buttermilk for 30 g more boiled cider. Sharper apple, slightly tighter crumb.
  - C tests the altitude rule for 4,700 ft.
