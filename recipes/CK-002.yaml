code: CK-002
kind: sheet
name: Pumpkin chocolate chip cookie bars
cls: Cookie · Bar
lede: Brown butter, pumpkin and warm spice. No eggs, so the bars stay dense and chewy.
source: NYT Cooking · Adapted, metric
contains:
- Wheat
- Milk
- Soy
equipment:
- 23 × 33 cm metal or glass pan
- Parchment sling
- Light-colored saucepan
- 0.1 g scale
key_figures:
- label: Yield · 9 × 13 in pan
  value: 24 squares
- label: Dough
  value: 1,329 g
- label: Sugar ÷ flour
  value: 120%
- label: Bake
  value: 30–45 min
- label: Oven · 325 °F
  value: 165 °C
last_change: Rev 01 · First issue
method_rail:
- sub: Tick each step as done
  notes: null
method:
- head: Brown butter.
  text: Melt in a light saucepan, stirring, until foamy, light amber and nutty.
  time: 3–4 min
  target: after melting
- head: Cool.
  text: Scrape the butter and browned bits into a large bowl. Cool until warm, not hot.
  time: 20 min
  target: Warm
- head: Prep.
  text: Heat the oven. Grease the pan and lay a parchment sling over the long sides (fig. 1).
  time: —
  target: 165 °C
  target_f: 325 °F
- head: Wet.
  text: Whisk part B into the butter until smooth and glossy.
  time: 1 min
- head: Dry.
  text: Add part C and stir just until no flour pockets remain. Stir in the dough chips.
  time: —
  target: Don’t overmix
- head: Press.
  text: Press into an even layer with oiled hands. Press the top chips in.
  time: —
  target: 39 g on top
- head: Bake.
  text: Until puffed and lightly browned; a skewer shows moist crumbs or melted chocolate.
  time: 30–45 min
  target: 165 °C
  target_f: 325 °F
- head: Cool + cut.
  text: At least 1 h in the pan. Lift out by the sling and cut 6 × 4 (fig. 1).
  time: 1 h
  target: 24 squares
formula:
  basis: '% · flour = 100'
  notes:
  - Teaspoon amounts are converted to grams; weigh them on a 0.1 g scale.
  - 'Salt by weight: 1 tsp Diamond Crystal ≈ 3 g. Other brands are denser by the spoon.'
  - † Doesn’t scale in a straight line. Past 2×, trial spices and leavening first.
