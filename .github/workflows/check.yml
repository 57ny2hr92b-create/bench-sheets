name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Unpack IBM Plex Sans for the fit check
        run: cd tools/fonts && npm pack @fontsource/ibm-plex-sans@5 && tar xzf fontsource-ibm-plex-sans-*.tgz
      - run: python -m pytest -q
      - run: python build.py check
      - uses: actions/upload-artifact@v4
        with: {name: artboards, path: out/}
